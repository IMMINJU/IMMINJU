  <circle cx="60" cy="18" r="6" fill="#8bd5a0"/>
  <text x="340" y="22" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#908e92">imminju@github ~ %</text>

  <g class="a0" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
    <text x="20" y="62"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> ▌</tspan></text>
  </g>
  <g class="a1" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
    <text x="20" y="62">
