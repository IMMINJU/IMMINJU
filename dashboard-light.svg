      <tspan fill="#908e92"> git log</tspan>
      <tspan fill="#ffd56b"> --grep="reported vs real"</tspan>
    </text>
  </g>
  <g class="a5" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
