<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 385" width="680" height="385">
  <defs>

    <symbol id="wait"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b" class="waiting-cursor"> ▌</tspan></text></symbol>
    <symbol id="d0"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> ▌</tspan></text></symbol>
    <symbol id="d1"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> H▌</tspan></text></symbol>
    <symbol id="d2"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> He▌</tspan></text></symbol>
    <symbol id="d3"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hel▌</tspan></text></symbol>
    <symbol id="d4"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hell▌</tspan></text></symbol>
    <symbol id="d5"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello▌</tspan></text></symbol>
    <symbol id="d6"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello ▌</tspan></text></symbol>
    <symbol id="d7"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello s▌</tspan></text></symbol>
    <symbol id="d8"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello st▌</tspan></text></symbol>
    <symbol id="d9"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello str▌</tspan></text></symbol>
    <symbol id="d10"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello stra▌</tspan></text></symbol>
    <symbol id="d11"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello stran▌</tspan></text></symbol>
    <symbol id="d12"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello strang▌</tspan></text></symbol>
    <symbol id="d13"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello strange▌</tspan></text></symbol>
    <symbol id="d14"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello stranger▌</tspan></text></symbol>
    <symbol id="d15"><text x="0" y="14" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13"><tspan fill="#ff6b8a">❯</tspan><tspan fill="#ffd56b"> Hello stranger!</tspan><tspan fill="#ffd56b" class="cursor-end">▌</tspan></text></symbol>
