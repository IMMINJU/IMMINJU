  <style>
    @keyframes show {
      to { opacity: 1; }
    }
    @keyframes hide {
      to { opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes typing {
      0%, 42.9% { transform: translateX(0); }
      42.9% { transform: translateX(-680px); }
      46.4% { transform: translateX(-1360px); }
      50.0% { transform: translateX(-2040px); }
      53.6% { transform: translateX(-2720px); }
      57.1% { transform: translateX(-3400px); }
      60.7% { transform: translateX(-4080px); }
      64.3% { transform: translateX(-4760px); }
      67.9% { transform: translateX(-5440px); }
      71.4% { transform: translateX(-6120px); }
      75.0% { transform: translateX(-6800px); }
      78.6% { transform: translateX(-7480px); }
      82.1% { transform: translateX(-8160px); }
      85.7% { transform: translateX(-8840px); }
      89.3% { transform: translateX(-9520px); }
      92.9% { transform: translateX(-10200px); }
      96.4% { transform: translateX(-10880px); }
      100% { transform: translateX(-10880px); }
    }
    .blink-cursor { animation: blink 1s steps(1) infinite; }
    .a0 { animation: hide 0.01s 1.00s forwards; }
    .a1 { opacity: 0; animation: show 0.01s 1.00s forwards; }
    .a2 { opacity: 0; animation: show 0.01s 1.60s forwards; }
    .a3 { opacity: 0; animation: show 0.01s 2.10s forwards, hide 0.01s 2.90s forwards; }
    .a4 { opacity: 0; animation: show 0.01s 2.90s forwards; }
    .a5 { opacity: 0; animation: show 0.01s 3.50s forwards; }
    .a6 { opacity: 0; animation: show 0.01s 4.00s forwards, hide 0.01s 4.80s forwards; }
    .a7 { opacity: 0; animation: show 0.01s 4.80s forwards; }
    .a8 { opacity: 0; animation: show 0.01s 5.40s forwards; }
    .sec-typing { opacity: 0; animation: show 0.01s 6.00s forwards; }
    .reel { animation: typing 3.5s steps(1, end) 6.00s forwards; }
    .cursor-end { animation: blink 1s steps(1) infinite; }
    .waiting-cursor { animation: blink 1s steps(1) 2 forwards; }
  </style>

  <rect width="680" height="385" rx="10" fill="#2d2a2e"/>

  <rect width="680" height="36" rx="10" fill="#3d3a3e"/>
  <rect y="26" width="680" height="10" fill="#3d3a3e"/>
