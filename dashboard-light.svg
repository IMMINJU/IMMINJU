  </g>
  <g class="a7" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
    <text x="20" y="220">
      <tspan fill="#ff6b8a">❯</tspan>
      <tspan fill="#908e92"> git log</tspan>
      <tspan fill="#ffd56b"> projects/ --oneline</tspan>
    </text>
  </g>
  <g class="a8" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
    <text x="20" y="244"><tspan fill="#8bd5a0">[crosscheck]</tspan><tspan fill="#e8e3df"> multi-LLM verification</tspan><tspan fill="#908e92"></tspan></text>
    <text x="20" y="265"><tspan fill="#8bd5a0">[liner-chat]</tspan><tspan fill="#e8e3df"> LLM picks,</tspan><tspan fill="#908e92"> API verifies</tspan></text>
    <text x="20" y="286"><tspan fill="#8bd5a0">[claude-pet]</tspan><tspan fill="#e8e3df"> reacts to Claude Code</tspan><tspan fill="#908e92"> via hooks</tspan></text>
  </g>

  <!-- Typing animation -->
